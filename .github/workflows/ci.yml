name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      gateway_url:
        description: Default gateway URL baked into the APK
        required: false
        default: https://gateway.example.com/

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Server-side gateway: install, run the unit/integration tests
  # ---------------------------------------------------------------------------
  proxy-tests:
    name: Gateway tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: proxy/package-lock.json

      - name: Install dependencies
        working-directory: proxy
        run: npm ci

      - name: Run tests
        working-directory: proxy
        run: npm test

  # ---------------------------------------------------------------------------
  # Android client: assemble debug + release APKs and publish them
  # ---------------------------------------------------------------------------
  android-apks:
    name: Android APKs
    runs-on: ubuntu-latest
    env:
      GATEWAY_URL: ${{ github.event.inputs.gateway_url || 'https://gateway.example.com/' }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'aagateway-ci' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create release signing key
        working-directory: android
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt \
            -keystore release.keystore \
            -storetype PKCS12 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias gateway \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=AA Gateway, O=AA Gateway, C=US"
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=gateway
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug -PgatewayUrl="$GATEWAY_URL"

      - name: Build release APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleRelease -PgatewayUrl="$GATEWAY_URL"

      - name: Collect, verify and inspect APKs
        run: |
          set -euo pipefail
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/aa-gateway-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk apk/aa-gateway-release.apk
          ls -l apk
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "Using build tools: $BUILD_TOOLS"
          "$BUILD_TOOLS/apksigner" verify --print-certs apk/aa-gateway-debug.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs apk/aa-gateway-release.apk
          "$BUILD_TOOLS/aapt" dump badging apk/aa-gateway-release.apk | head -5

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aa-gateway-debug-apk
          path: apk/aa-gateway-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: aa-gateway-release-apk
          path: apk/aa-gateway-release.apk
          if-no-files-found: error

      - name: Publish APKs to a GitHub release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: AA Gateway APKs
          make_latest: true
          body: |
            Debug and release builds of the AA Gateway Android client.

            * `aa-gateway-debug.apk` — debug build, signed with the CI debug key.
            * `aa-gateway-release.apk` — release build, signed with the CI release key.

            Built from `${{ github.sha }}` by the CI workflow.
            Point the app at your own gateway deployment (menu → Gateway settings).
          files: |
            apk/aa-gateway-debug.apk
            apk/aa-gateway-release.apk
